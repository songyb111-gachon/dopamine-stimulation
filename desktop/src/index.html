<!doctype html>
<html lang="ko">

<script src="games/chalna.js"></script>
<script src="games/seomgwang.js"></script>
<script src="games/maeari.js"></script>
<script src="games/nakha.js"></script>

<!-- shell: boots last, after every game has registered -->
<script src="hub.js"></script>

</html>
