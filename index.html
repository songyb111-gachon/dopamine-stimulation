const save = {

function loadSave() {
  try {
    let s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!s) {
      const legacy = JSON.parse(localStorage.getItem('chalna_save_v1'));
      if (legacy && typeof legacy === 'object') {
        s = { bestScore: legacy.bestScore, bestStreak: legacy.bestStreak, lifetimePerfects: legacy.lifetimePerfects, totalRuns: legacy.totalRuns };
      }
    }
    const num = v => (Number.isFinite(+v) && +v > 0) ? Math.floor(+v) : 0;
    if (s && typeof s === 'object') {
      save.bestScore = num(s.bestScore);
      save.bestStreak = num(s.bestStreak);
      save.lifetimePerfects = num(s.lifetimePerfects);
      save.totalRuns = num(s.totalRuns);
      save.xp = num(s.xp);
      save.level = Math.max(1, num(s.level) || 1);
      save.coins = num(s.coins);
      save.coinsSpent = num(s.coinsSpent);
      save.recordBreaks = num(s.recordBreaks);
      if (s.achievements && typeof s.achievements === 'object') save.achievements = s.achievements;
      if (Array.isArray(s.unlockedThemes) && s.unlockedThemes.length) save.unlockedThemes = s.unlockedThemes;
      if (Array.isArray(s.unlockedTrails) && s.unlockedTrails.length) save.unlockedTrails = s.unlockedTrails;
      if (typeof s.activeTheme === 'string') save.activeTheme = s.activeTheme;
      if (typeof s.activeTrail === 'string') save.activeTrail = s.activeTrail;
      if (s.dailyBestByDate && typeof s.dailyBestByDate === 'object') save.dailyBestByDate = s.dailyBestByDate;
      save.dailyStreak = num(s.dailyStreak);
      if (typeof s.lastDailyDate === 'string') save.lastDailyDate = s.lastDailyDate;
      save.zenBest = num(s.zenBest);
      if (Array.isArray(s.ghost)) save.ghost = s.ghost;
      if (s.settings && typeof s.settings === 'object') {
        save.settings.reduceMotion = !!s.settings.reduceMotion;
        save.settings.colorblind = !!s.settings.colorblind;
      }
    }
  } catch (e) { /* private mode → session-only records */ }
}
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}

const canvas = document.getElementById('c');
const g = canvas.getContext('2d');
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
    this.moveTo(x + r.tl, y);
    this.lineTo(x + w - r.tr, y);
    this.arcTo(x + w, y, x + w, y + r.tr, r.tr);
    this.lineTo(x + w, y + h - r.br);
    this.arcTo(x + w, y + h, x + w - r.br, y + h, r.br);
    this.lineTo(x + r.bl, y + h);
    this.arcTo(x, y + h, x, y + h - r.bl, r.bl);
    this.lineTo(x, y + r.tl);
    this.arcTo(x, y, x + r.tl, y, r.tl);
    return this;
  };
}
let W = 0, H = 0, CX = 0, CY = 0, R = 0, DPR = 1;
let safeTop = 0, safeRight = 0;

/* ---------------- audio ---------------- */
let AC = null, bus = null, master = null, delayWet = null, noiseBuf = null;
let muted = false;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = muted ? 0 : 1;
    master.connect(AC.destination);
    const comp = AC.createDynamicsCompressor();
    comp.connect(master);
    bus = AC.createGain();
    bus.connect(comp);
    const delay = AC.createDelay(0.5);
    delay.delayTime.value = 0.16;
    const fb = AC.createGain(); fb.gain.value = 0.3;
    delay.connect(fb); fb.connect(delay);
    delayWet = AC.createGain(); delayWet.gain.value = 0;
    bus.connect(delay); delay.connect(delayWet); delayWet.connect(comp);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; master = null; bus = null; delayWet = null; noiseBuf = null; }
}
function resumeAudio() { if (AC && AC.state !== 'running') AC.resume().catch(() => {}); }
function setMuted(m) {
  muted = m;
  if (master) master.gain.setTargetAtTime(m ? 0 : 1, AC.currentTime, 0.01);
}
function tone(type, f0, f1, attack, dur, vol) {
  if (!AC || muted) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator(), gn = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(20, f0), t0);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.linearRampToValueAtTime(vol, t0 + attack);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn); gn.connect(bus);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, vol, filterType, f0, f1) {
  if (!AC || muted) return;
  const t0 = AC.currentTime;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf;
  src.loop = true;
  src.playbackRate.value = 1;
  const fl = AC.createBiquadFilter();
  fl.type = filterType || 'bandpass';
  fl.frequency.setValueAtTime(f0 || 2000, t0);
  if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  fl.Q.value = 1;
  const gn = AC.createGain();
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.linearRampToValueAtTime(vol, t0 + 0.005);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(fl); fl.connect(gn); gn.connect(bus);
  src.start(t0); src.stop(t0 + dur + 0.05);
}

};

/* ---------------- seeded RNG (daily challenge determinism) ---------------- */
function hashStr(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return (h ^ (h >>> 16)) >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function kstDateStr() {
  const d = new Date(Date.now() + 9 * 3600 * 1000);
  return d.toISOString().slice(0, 10);
}
let RNG = Math.random;
const randR = (a, b) => a + RNG() * (b - a);

/* ---------------- effects entities ---------------- */
const POOL_N = 300;
const pool = [];
for (let i = 0; i < POOL_N; i++) pool.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 2, color: '#fff', kind: 0, rot: 0, vr: 0 });
function spawnP(x, y, vx, vy, life, size, color, kind) {
  for (let i = 0; i < POOL_N; i++) {
    const p = pool[i];
    if (!p.on) {
      p.on = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy;
      p.life = life; p.max = life; p.size = size; p.color = color;
      p.kind = kind || 0; p.rot = rand(0, TAU); p.vr = rand(-6, 6);
      return;
    }
  }
}
function burst(x, y, n, color, speed, kind) {
  if (save.settings.reduceMotion) n = Math.ceil(n * 0.35);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(speed * 0.35, speed);
    spawnP(x, y, Math.cos(a) * v, Math.sin(a) * v, rand(0.4, kind === 1 ? 1.2 : 0.6), rand(2, kind === 1 ? 6 : 4), color, kind);
  }
}

}

/* ---------------- achievements ---------------- */
// achievement toasts are a strict one-at-a-time FIFO queue (never stack with each
// other or with milestone/record banners) so a burst of unlocks never collides with the HUD.
let achToastQueue = [], achToast = null;
function unlock(id) {
  if (save.achievements[id]) return;
  save.achievements[id] = true;
  achToastQueue.push('업적 달성: ' + (S.achName[id] || id));
  sAchievement();
  writeSave();
}
function updateAchToast(dt) {
  if (achToast) {
    achToast.t += dt;
    if (achToast.t >= achToast.dur) achToast = null;
  }
  if (!achToast && achToastQueue.length) achToast = { text: achToastQueue.shift(), t: 0, dur: 1.9 };
}

/* ---------------- cosmetics ---------------- */
function isThemeUnlocked(id) { return THEMES[id] && (save.level >= THEMES[id].lv || save.unlockedThemes.indexOf(id) >= 0); }
function isTrailUnlocked(id) { return TRAILS[id] && (save.level >= TRAILS[id].lv || save.unlockedTrails.indexOf(id) >= 0); }
function applyTheme(id) { if (!THEMES[id]) return; save.activeTheme = id; PAL = THEMES[id]; }
function applyTrail(id) { if (!TRAILS[id]) return; save.activeTrail = id; TRAIL_COLOR = TRAILS[id].color; }
function tryEquipOrBuyTheme(id) {
  if (!THEMES[id]) return;
  if (isThemeUnlocked(id)) {
    if (save.unlockedThemes.indexOf(id) < 0) save.unlockedThemes.push(id);
    applyTheme(id); writeSave(); sBlip(2); return;
  }
  const price = THEMES[id].price;
  if (save.coins >= price) {
    save.coins -= price; save.coinsSpent += price;
    save.unlockedThemes.push(id); applyTheme(id); writeSave(); sMilestone();
    if (save.coinsSpent >= 100) unlock('coins_100_spent');
  } else sClick();
}
function tryEquipOrBuyTrail(id) {
  if (!TRAILS[id]) return;
  if (isTrailUnlocked(id)) {
    if (save.unlockedTrails.indexOf(id) < 0) save.unlockedTrails.push(id);
    applyTrail(id); writeSave(); sBlip(2); return;
  }
  const price = TRAILS[id].price;
  if (save.coins >= price) {
    save.coins -= price; save.coinsSpent += price;
    save.unlockedTrails.push(id); applyTrail(id); writeSave(); sMilestone();
    if (save.coinsSpent >= 100) unlock('coins_100_spent');
  } else sClick();
}
function toggleSetting(id) {
  if (id !== 'reduceMotion' && id !== 'colorblind') return;
  save.settings[id] = !save.settings[id];
  writeSave(); sBlip(1);
}

/* ---------------- progression ---------------- */
function xpToNext(level) { return 80 + 40 * level; }
let pendingLevelUps = [];
function onLevelUp(newLevel) {
  pushBanner(S.levelUp(newLevel), PAL.perfect, 1.6, 30);
  sLevelUp();
  pendingLevelUps.push(newLevel);
  if (newLevel === 5) unlock('level_5');
  if (newLevel === 10) unlock('level_10');
  if (newLevel === 12) unlock('level_12');
}
function grantXP(amount) {
  if (amount <= 0) return;
  save.xp += amount;
  while (save.xp >= xpToNext(save.level)) {
    save.xp -= xpToNext(save.level);
    save.level++;
    onLevelUp(save.level);
  }
}
function isWobbleUnlocked() { return save.level >= 3; }
function isShrinkUnlocked() { return save.level >= 5; }
function isDecoyUnlocked() { return save.level >= 8; }
function isChainUnlocked() { return save.level >= 12; }
function isDailyUnlocked() { return save.level >= 2; }
function isCollectionUnlocked() { return save.level >= 2; }

/* ---------------- daily streak ---------------- */
function updateDailyStreak(today) {
  if (save.lastDailyDate === today) return;
  if (save.lastDailyDate) {
    const prev = new Date(save.lastDailyDate + 'T00:00:00Z');
    const cur = new Date(today + 'T00:00:00Z');
    const diffDays = Math.round((cur - prev) / 86400000);
    save.dailyStreak = diffDays === 1 ? save.dailyStreak + 1 : 1;
  } else {
    save.dailyStreak = 1;
  }
  save.lastDailyDate = today;
  if (save.dailyStreak >= 7) unlock('daily_streak_7');
}

/* ---------------- game state ---------------- */
const ST_MENU = 0, ST_PLAY = 1, ST_DYING = 2, ST_OVER = 3, ST_COLLECTION = 4;
let state = ST_MENU;
let paused = false;
let mode = 'classic'; // classic | daily | zen

let needle = 0, dir = 1;
let arc = null;               // {center, w, p, gold, mod, dist0, center0, wFreq, wPhase}
let decoy = null;             // {center, w} | null
let lastGold = false;
let travelSinceSpawn = 0, arcAge = 0;
let hits = 0, score = 0, streak = 0;
let runMaxStreak = 0, runPerfects = 0, runChainClears = 0;
let startBest = 0, startBestStreak = 0;
let recordBroken = false, scoreGold = false;
let fever = false, feverT = 0, feverMix = 0;
let hitStop = 0, shakeT = 0, shakeMag = 0;
let pulsePhase = 0, clickAcc = 0;
let nearMsgCd = 0, hbTimer = 0, hbOn = false;
let grace = 0, speedEase = 1;
let streakPunchT = 0, streakDeflateT = 0;
let inputLockUntil = 0;
let trail = [];
let chainLinksLeft = 0, chainPerfects = 0, chainTotal = 0;
let zenTimeLeft = 60;
let runElapsed = 0;
let liveGhost = [], ghostRecordAcc = 0, ghostPlaybackIdx = 0;
let lastRunXP = 0, lastRunCoins = 0;

// dying / gameover
let dieT = 0, ghostAngle = 0, missSecs = 0, missLate = false, missArcGold = false, missEdgeMs = 0, deathReason = 'edge';
let panelT = 0, countT = 0, countDone = false, shownScore = 0, lastBlip = -1;
let tauntText = '', newBest = false, newBestStreak = false, confettiFired = false;

let lastNow = performance.now();
let timeScale = 1;

const mult = st => st >= 15 ? 5 : st >= 10 ? 4 : st >= 6 ? 3 : st >= 3 ? 2 : 1;
const omega = n => Math.min(200 + 7 * Math.max(0, n - 3), 460);
const goodW = n => Math.max(42 - 0.5 * Math.max(0, n - 3), omega(n) * 0.070);
const perfW = n => Math.max(goodW(n) * 0.28, omega(n) * 0.030);
function effPerfW() {
  const base = arc.p * (fever ? 1.2 : 1);
  if (arc.mod === 'shrink') {
    const frac = clamp(travelSinceSpawn / Math.max(1, arc.dist0), 0, 1);
    return lerp(arc.p * 1.35, arc.p * 0.65, frac) * (fever ? 1.2 : 1);
  }
  return base;
}
function arcCenterNow() {
  if (!arc) return 0;
  if (arc.mod === 'wobble') return norm360(arc.center0 + 5 * Math.sin(TAU * arc.wFreq * arcAge + arc.wPhase));
  return arc.center;
}

function pickTaunt(missEdge) {
  if (hits % 10 === 9) return '한 타만 더 하면 ' + (hits + 1) + '타였는데...';
  if (streak >= 6 && streak < 8) return '피버 직전이었는데!';
  if (missEdge <= 20) return '한 끗 차이... 겨우 ' + Math.max(1, Math.round(missEdge)) + 'ms!';
  if (missArcGold) return '골드 욕심이 과했나?';
  if (startBest > 0 && score < startBest && score >= 0.9 * startBest)
    return '최고 기록까지 단 ' + (startBest - score) + '점!';
  if (streak >= 10) return '연속 퍼펙트 ' + streak + '에서... 아깝다!';
  if (hits < 5) return '워밍업은 끝났죠?';
  return '다시 하면 넘길 수 있어요';
}

function spawnChainLink() {
  const n = hits;
  const dist0 = randR(40, 70);
  arc = { center: norm360(needle + dir * dist0), w: goodW(n) * 0.6, p: perfW(n), gold: false, mod: 'chain', dist0, center0: 0, wFreq: 0, wPhase: 0 };
  decoy = null;
  travelSinceSpawn = 0; arcAge = 0;
}

function spawnArc() {
  decoy = null;
  const n = hits;

  if (chainLinksLeft === 0 && n >= 15 && isChainUnlocked() && RNG() < 0.10) {
    chainLinksLeft = 3; chainPerfects = 0; chainTotal = 0;
    spawnChainLink();
    return;
  }

  let mod = null, gold = false;
  if (n >= 10 && !lastGold && RNG() < 1 / 8) gold = true;
  else if (n >= 6 && isWobbleUnlocked() && RNG() < 0.20) mod = 'wobble';
  else if (n >= 6 && isShrinkUnlocked() && RNG() < 0.20) mod = 'shrink';
  else if (n >= 10 && isDecoyUnlocked() && RNG() < 0.25) mod = 'decoy';
  lastGold = gold;

  const dist0 = randR(100, 260);
  const center = norm360(needle + dir * dist0);
  arc = {
    center, w: goodW(n), p: perfW(n), gold, mod, dist0,
    center0: center, wFreq: 1.1 + 0.02 * Math.min(n, 40), wPhase: RNG() * TAU,
  };
  travelSinceSpawn = 0; arcAge = 0;

  if (mod === 'wobble') sWobble();
  if (mod === 'shrink') sShrink();

  if (mod === 'decoy') {
    const dWidth = goodW(n) * 0.75;
    let dCenter = 0, ok = false;
    for (let tries = 0; tries < 5; tries++) {
      dCenter = norm360(needle + dir * randR(35, 70));
      if (Math.abs(signedDelta(dCenter, center)) >= (dWidth + arc.w) / 2 + 12) { ok = true; break; }
    }
    if (ok) decoy = { center: dCenter, w: dWidth };
    else arc.mod = null;
  }
}

function startRun(m) {
  mode = m || 'classic';
  state = ST_PLAY;
  score = 0; hits = 0; streak = 0; runMaxStreak = 0; runPerfects = 0; runChainClears = 0;
  startBest = save.bestScore; startBestStreak = save.bestStreak;
  recordBroken = false; scoreGold = false;
  fever = false; feverT = 0; feverMix = 0;
  hitStop = 0; shakeT = 0; pulsePhase = 0; clickAcc = 0;
  nearMsgCd = 0; hbTimer = 0; hbOn = false;
  grace = 0; speedEase = 1; lastGold = false;
  streakPunchT = 0; streakDeflateT = 0;
  chainLinksLeft = 0; chainPerfects = 0; chainTotal = 0;
  zenTimeLeft = 60; runElapsed = 0;
  liveGhost = []; ghostRecordAcc = 0; ghostPlaybackIdx = 0;
  pendingLevelUps = [];
  trail = []; pops = []; banners = []; stamps = []; waves = []; flashes = []; frags = [];
  for (let i = 0; i < POOL_N; i++) pool[i].on = false;

  RNG = mode === 'daily' ? mulberry32(hashStr('chalna-' + kstDateStr())) : Math.random;
  dir = RNG() < 0.5 ? 1 : -1;
  if (mode === 'daily') unlock('daily_first_play');

  spawnArc();
}

/* tip of the needle in screen space */
const tipX = a => CX + Math.cos(rad(a)) * R;
const tipY = a => CY + Math.sin(rad(a)) * R;

function checkRecord() {
  if (mode !== 'classic') return;
  if (!recordBroken && startBest > 0 && score > startBest) {
    recordBroken = true; scoreGold = true;
    save.bestScore = score; save.recordBreaks++; writeSave();
    pushBanner(S.newRecord, PAL.perfect, 1.6, 34);
    sShimmer();
    if (save.recordBreaks >= 5) unlock('record_x5');
    for (let i = 0; i < 40; i++) burst(CX, CY - R - 20, 1, PAL.perfect, 260, 1);
  } else if (recordBroken && score > save.bestScore) {
    save.bestScore = score; writeSave();
  } else if (startBest === 0 && score > save.bestScore) {
    save.bestScore = score; writeSave();
  }
}

function startFever() {
  fever = true; feverT = 6;
  if (delayWet && AC) delayWet.gain.setTargetAtTime(0.35, AC.currentTime, 0.05);
  sFever();
  unlock('fever_first');
  stamps.push({ text: S.fever, color: COL.fever, t: 0, dur: 1.0, size: 64 });
}
function endFever() {
  fever = false;
  if (delayWet && AC) delayWet.gain.setTargetAtTime(0, AC.currentTime, 0.1);
}

function bookkeepHit() {
  hits++;
  if (hits % 10 === 0) {
    score += 50;
    pushBanner(S.milestone(hits), COL.white, 1.1, 30);
    popup(S.plus(50), CX, CY - R * 0.45, 22, COL.white, 0);
    sMilestone();
  }
  checkRecord();
}

function chainFinisherBonus() {
  const bonus = 150 * mult(streak);
  score += bonus;
  popup(S.chainClear, CX, CY - R * 0.32, 30, PAL.perfect, 1);
  popup(S.plus(bonus), CX, CY, 28, PAL.perfect, 1);
  sChainComplete();
  unlock('chain_clear');
  runChainClears++;
  burst(CX, CY, 60, PAL.perfect, 420, 0);
  waves.push({ t: 0 });
}

function doPerfect(absD) {
  const gold = arc.gold;
  const isChain = arc.mod === 'chain';
  const pts = 25 * mult(streak) * (fever ? 2 : 1) * (gold ? 3 : 1);
  score += pts;
  streak++;
  streakPunchT = 0.15;
  runMaxStreak = Math.max(runMaxStreak, streak);
  runPerfects++; save.lifetimePerfects++;
  if (save.lifetimePerfects === 1) unlock('first_perfect');
  if (save.lifetimePerfects === 100) unlock('lifetime_100');
  if (save.lifetimePerfects === 1000) unlock('lifetime_1000');
  if (streak === 10) unlock('streak_10');
  if (streak === 20) unlock('streak_20');
  if (gold) unlock('gold_first');

  const notReduced = !save.settings.reduceMotion;
  if (notReduced) { hitStop = 0.04; shakeT = 0.12; shakeMag = 12; }
  const cNow = arcCenterNow();
  const tx = tipX(needle), ty = tipY(needle);
  burst(tx, ty, 24, PAL.perfect, 340, 0);
  waves.push({ t: 0 });
  if (notReduced) for (let i = 0; i < 3; i++)
    frags.push({ a0: cNow - arc.w / 2 + (i * arc.w) / 3, span: arc.w / 3, r: R, vr: rand(40, 120), va: rand(-90, 90), t: 0 });
  popup(S.plus(pts), tx, ty - 26, 26, gold ? PAL.perfect : COL.white, 1);
  popup(S.perfect, CX, CY - R * 0.15, 32, PAL.perfect, 1);
  if (gold) popup(S.goldHit, CX, CY - R * 0.30, 30, PAL.perfect, 1);
  sPerfect(streak, gold);
  buzz(10);
  if (streak % 8 === 0) startFever();
  bookkeepHit();

  if (isChain) {
    chainPerfects++; chainTotal++;
    sChainLink(chainTotal);
    chainLinksLeft--;
    if (chainLinksLeft > 0) { spawnChainLink(); return; }
    if (chainPerfects === 3) chainFinisherBonus();
    dir = -dir; spawnArc();
    return;
  }
  dir = -dir; spawnArc();
}

function doGood(absD) {
  const prevStreak = streak;
  const pre = mult(streak);
  const pts = 10 * pre * (fever ? 2 : 1);
  const perfectWouldPay = 25 * pre * (fever ? 2 : 1) * (arc.gold ? 3 : 1);
  const w = omega(hits) * Math.max(speedEase, 0.01);
  const msToPerf = (absD - effPerfW() / 2) / w * 1000;
  score += pts;
  streak = 0;
  if (prevStreak > 0) streakDeflateT = 0.12;
  const tx = tipX(needle), ty = tipY(needle);
  burst(tx, ty, 8, COL.goodFx, 180, 0);
  popup(S.good, tx, ty - 44, 18, COL.goodFx, 0);
  popup(S.plus(pts), tx, ty - 22, 20, COL.goodFx, 0);
  pops.push({ text: S.foregone(perfectWouldPay), x: tx, y: ty + 6, life: 0.8, max: 0.8, size: 15, color: COL.gray, vy: -30, punch: 0 });
  if (msToPerf <= 15 && nearMsgCd <= 0) {
    popup(S.nearPerfect(Math.max(1, Math.round(msToPerf))), CX, CY - R * 0.55, 24, '#FFE9AF', 1);
    if (msToPerf <= 1) unlock('near_miss_1ms');
    nearMsgCd = 3;
  }
  sGood();
  bookkeepHit();

  if (arc.mod === 'chain') chainLinksLeft = 0;
  dir = -dir; spawnArc();
}

function doZenMiss(signedOffset) {
  streak = 0;
  const tx = tipX(needle), ty = tipY(needle);
  popup('아쉬워요', tx, ty - 30, 18, COL.miss, 0);
  sZenSoft(); buzz(8);
  bookkeepHit();
  if (arc.mod === 'chain') chainLinksLeft = 0;
  dir = -dir; spawnArc();
}

function finalizeRunRewards() {
  save.totalRuns++;
  const xpGain = Math.floor(score / 8) + runPerfects * 3 + runChainClears * 10;
  const factor = mode === 'zen' ? 0.4 : 1;
  lastRunXP = Math.floor(xpGain * factor);
  lastRunCoins = Math.floor(hits / 5);
  save.coins += lastRunCoins;
  grantXP(lastRunXP);
  if (mode === 'daily') {
    const today = kstDateStr();
    const prev = save.dailyBestByDate[today] || 0;
    if (score > prev) save.dailyBestByDate[today] = score;
    updateDailyStreak(today);
  }
  if (mode === 'zen') save.zenBest = Math.max(save.zenBest, score);
  if (save.totalRuns === 50) unlock('runs_50');
  writeSave();
}

function doMiss(signedOffset, reason) {
  reason = reason || 'edge';
  deathReason = reason;
  if (reason === 'edge') {
    const w = omega(hits) * Math.max(speedEase, 0.01);
    missSecs = Math.abs(signedOffset) / w;
    missLate = signedOffset > 0;
    missEdgeMs = (Math.abs(signedOffset) - arc.w / 2) / w * 1000;
    if (Math.abs(signedOffset) <= 1.5 * arc.w)
      flashes.push({ ang: arc.center + dir * Math.sign(signedOffset || 1) * arc.w / 2, t: 0 });
    tauntText = pickTaunt(missEdgeMs);
  } else {
    missSecs = 0; missLate = true; missEdgeMs = 999;
    flashes.push({ ang: decoy ? decoy.center : needle, t: 0 });
    tauntText = S.decoyTaunt;
  }
  missArcGold = arc.gold;
  ghostAngle = needle;
  endFever();
  if (reason === 'decoy') { sDecoyGotcha(); unlock('decoy_fooled'); } else { sMiss(); }
  buzz(20);
  newBest = mode === 'classic' && score > startBest;
  newBestStreak = mode === 'classic' && runMaxStreak > startBestStreak;
  if (mode === 'classic') {
    save.bestScore = Math.max(save.bestScore, score);
    save.bestStreak = Math.max(save.bestStreak, runMaxStreak);
    if (newBest) save.ghost = liveGhost.slice();
  }
  finalizeRunRewards();
  state = ST_DYING; dieT = 0;
}

function doZenTimeUp() {
  newBest = false; newBestStreak = false;
  finalizeRunRewards();
  unlock('zen_complete');
  tauntText = S.zenTimeUp;
  state = ST_OVER; panelT = 0; countT = 0; countDone = false;
  shownScore = 0; lastBlip = -1; confettiFired = false;
}

function ghostAngleAt(t) {
  const gh = save.ghost;
  if (!gh || gh.length < 2) return null;
  while (ghostPlaybackIdx < gh.length - 2 && gh[ghostPlaybackIdx + 1].t < t) ghostPlaybackIdx++;
  const a = gh[ghostPlaybackIdx], b = gh[Math.min(ghostPlaybackIdx + 1, gh.length - 1)];
  if (t > b.t) return null;
  const span = b.t - a.t;
  const f = span > 0 ? clamp((t - a.t) / span, 0, 1) : 0;
  const d = signedDelta(b.a, a.a);
  return norm360(a.a + d * f);
}

/* ---------------- input ---------------- */
const muteRect = () => ({ x: W - 48 - safeRight, y: 12 + safeTop, w: 36, h: 36 });
function inMute(x, y) { const r = muteRect(); return x >= r.x - 6 && x <= r.x + r.w + 6 && y >= r.y - 6 && y <= r.y + r.h + 6; }
const backBtnRect = () => ({ x: 12, y: 12 + safeTop, w: 36, h: 36 });
function inBackBtn(x, y) { const r = backBtnRect(); return x >= r.x - 6 && x <= r.x + r.w + 6 && y >= r.y - 6 && y <= r.y + r.h + 6; }

function getMenuCardRects() {
  const cardW = Math.min(340, W - 48), cardH = 50, gap = 10;
  const total = 4 * cardH + 3 * gap;
  const startY = Math.max(CY + R * 0.35, H - total - 96);
  const x = CX - cardW / 2;
  return [
    { id: 'classic', label: S.menuClassic, x, y: startY, w: cardW, h: cardH, locked: false, lv: 1 },
    { id: 'daily', label: S.menuDaily, x, y: startY + (cardH + gap), w: cardW, h: cardH, locked: !isDailyUnlocked(), lv: 2 },
    { id: 'zen', label: S.menuZen, x, y: startY + 2 * (cardH + gap), w: cardW, h: cardH, locked: false, lv: 1 },
    { id: 'collection', label: S.menuCollection, x, y: startY + 3 * (cardH + gap), w: cardW, h: cardH, locked: !isCollectionUnlocked(), lv: 2 },
  ];
}

function layoutCollection() {
  const top = 64 + safeTop;
  let y = top;
  const L = {};
  L.headerY = y; y += 36;
  L.levelBarY = y; y += 34;
  L.coinsY = y; y += 30;
  L.achLabelY = y; y += 20;
  const cols = 6, rows = 3, dot = 8, dgap = 15;
  const gw = cols * dot * 2 + (cols - 1) * dgap;
  const ax0 = CX - gw / 2;
  L.achDots = [];
  for (let i = 0; i < ACH_ORDER.length && i < cols * rows; i++) {
    const c = i % cols, r = (i / cols) | 0;
    L.achDots.push({ id: ACH_ORDER[i], x: ax0 + c * (dot * 2 + dgap) + dot, y: y + r * (dot * 2 + dgap) + dot, r: dot });
  }
  y += rows * (dot * 2 + dgap) + 14;
  L.themesLabelY = y; y += 20;
  const themeIds = Object.keys(THEMES), tsize = 50, tgap = 14;
  const tw = themeIds.length * tsize + (themeIds.length - 1) * tgap;
  const tx0 = CX - tw / 2;
  L.themes = themeIds.map((id, i) => ({ id, x: tx0 + i * (tsize + tgap), y, w: tsize, h: tsize }));
  y += tsize + 30;
  L.trailsLabelY = y; y += 20;
  const trailIds = Object.keys(TRAILS), rsize = 50, rgap = 14;
  const rw = trailIds.length * rsize + (trailIds.length - 1) * rgap;
  const rx0 = CX - rw / 2;
  L.trails = trailIds.map((id, i) => ({ id, x: rx0 + i * (rsize + rgap), y, w: rsize, h: rsize }));
  y += rsize + 26;
  const sw = Math.min(300, W - 48), sh = 38, sgap = 10;
  L.settings = [
    { id: 'reduceMotion', label: S.settingsReduceMotion, x: CX - sw / 2, y, w: sw, h: sh },
    { id: 'colorblind', label: S.settingsColorblind, x: CX - sw / 2, y: y + sh + sgap, w: sw, h: sh },
  ];
  y += 2 * sh + sgap + 20;
  L.bottom = y;
  return L;
}

function judge() {
  const t = performance.now();
  const el = clamp((t - lastNow) / 1000, 0, 0.05);
  const advance = dir * omega(hits) * speedEase * timeScale * el;
  needle = norm360(needle + advance);
  travelSinceSpawn += Math.abs(advance);
  lastNow = t;

  const center = arcCenterNow();
  const P = effPerfW();
  const dRaw = signedDelta(needle, center);
  const absD = Math.abs(dRaw);

  if (absD <= P / 2) { doPerfect(absD); return; }
  if (absD <= arc.w / 2) { doGood(absD); return; }

  if (decoy) {
    const dd = Math.abs(signedDelta(needle, decoy.center));
    if (dd <= decoy.w / 2) {
      if (mode === 'zen') doZenMiss(travelSinceSpawn - arc.dist0);
      else doMiss(travelSinceSpawn - arc.dist0, 'decoy');
      return;
    }
  }

  const signedOffset = travelSinceSpawn - arc.dist0;
  if (mode === 'zen') doZenMiss(signedOffset);
  else doMiss(signedOffset, 'edge');
}

function onInput(x, y, fromPointer) {
  initAudio(); resumeAudio();
  if (fromPointer && inMute(x, y)) { setMuted(!muted); return; }
  if (fromPointer && state !== ST_MENU && inBackBtn(x, y)) {
    chainLinksLeft = 0;
    endFever();
    hbOn = false;
    state = ST_MENU;
    return;
  }
  if (paused || grace > 0) return;
  const now = performance.now();
  if (now < inputLockUntil) return;

  if (state === ST_MENU) {
    if (!fromPointer) { startRun('classic'); return; }
    const cards = getMenuCardRects();

  const f = clamp(dieT / 0.6, 0, 1);
  g.fillStyle = 'rgba(90,96,110,' + (0.55 * f).toFixed(3) + ')';
  g.fillRect(-20, -20, W + 40, H + 40);
  const tf = clamp(dieT / 0.35, 0, 1);
  const sc = lerp(3, 1, backOut(tf));
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = COL.miss;
  g.font = '900 ' + Math.round(Math.min(38, W * 0.085) * sc) + 'px ' + FONT;
  const msg = deathReason === 'decoy' ? S.decoyMissMsg : (missLate ? S.missLate : S.missEarly)(missSecs.toFixed(3));
  g.shadowBlur = 20; g.shadowColor = COL.miss;
  g.fillText(msg, CX, CY + R * 0.55);
  g.shadowBlur = 0;
}

function renderPanel(now) {
  const Hp = Math.min(440, H * 0.66);
  const f = clamp(panelT / 0.25, 0, 1);
  const top = H - Hp * backOut(f);
  g.save();
  g.fillStyle = 'rgba(13,18,32,0.96)';
  g.beginPath();
  g.roundRect(8, top, W - 16, Hp + 24, 18);
  g.fill();
  if (newBest) {
    g.strokeStyle = PAL.perfect; g.lineWidth = 2;
    g.shadowBlur = 12; g.shadowColor = PAL.perfect;
    g.beginPath(); g.roundRect(8, top, W - 16, Hp + 24, 18); g.stroke();
    g.shadowBlur = 0;
  }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = COL.gray;
  g.font = '600 16px ' + FONT;
  g.fillText(tauntText, CX, top + 38);
  g.fillStyle = COL.gray; g.font = '500 14px ' + FONT;
  g.fillText(S.lblScore, CX, top + 74);
  g.fillStyle = newBest ? PAL.perfect : PAL.needle;
  g.font = '800 50px ' + FONT;
  drawTabular(String(shownScore), CX, top + 112);

  let rows;
  if (mode === 'zen') {
    rows = [[S.zenResultBest, save.zenBest, save.zenBest === score && score > 0], [S.lblLifetime, save.lifetimePerfects, false]];
  } else if (mode === 'daily') {
    rows = [[S.dailyResultBest, save.dailyBestByDate[kstDateStr()] || 0, newBest], [S.lblBestStreak, save.bestStreak, newBestStreak]];
  } else {
    rows = [[S.lblBest, save.bestScore, newBest], [S.lblBestStreak, save.bestStreak, newBestStreak], [S.lblLifetime, save.lifetimePerfects, false]];
  }
  let ry = top + 164;
  for (const [lbl, val, isNew] of rows) {
    g.textAlign = 'left';
    g.fillStyle = COL.gray; g.font = '500 14px ' + FONT;
    g.fillText(lbl, CX - 130, ry);
    g.textAlign = 'right';
    g.fillStyle = PAL.needle; g.font = '700 17px ' + FONT;
    g.fillText(String(val), CX + (isNew ? 74 : 130), ry);
    if (isNew && countDone) {
      const pulse2 = 1 + 0.12 * Math.sin(now / 120);
      g.textAlign = 'right';
      g.fillStyle = PAL.perfect;
      g.font = '800 ' + Math.round(15 * pulse2) + 'px ' + FONT;
      g.shadowBlur = 10; g.shadowColor = PAL.perfect;
      g.fillText(S.newFlare, CX + 130, ry);
      g.shadowBlur = 0;
    }
    ry += 30;
  }

  if (countDone) {
    g.textAlign = 'center';
    g.fillStyle = COL.ach; g.font = '600 15px ' + FONT;
    g.fillText(S.resultReward(lastRunXP, lastRunCoins), CX, ry + 6);
    ry += 26;
    if (pendingLevelUps.length) {
      g.fillStyle = PAL.perfect; g.font = '700 15px ' + FONT;
      g.fillText(S.levelUp(pendingLevelUps[pendingLevelUps.length - 1]), CX, ry + 6);
    }
  }

  if (panelT >= 0.4) {
    const pulse = 0.55 + 0.45 * Math.sin(now / 400);
    g.globalAlpha = pulse;
    g.textAlign = 'center';
    g.fillStyle = PAL.needle;
    g.font = '700 18px ' + FONT;
    g.fillText(S.tapRestart, CX, top + Hp - 34);
    g.globalAlpha = 1;
  }
  g.restore();
}

function renderCollection(now) {
  const L = layoutCollection();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = PAL.needle; g.font = '800 24px ' + FONT;
  g.fillText(S.collectionTitle, CX, L.headerY);

  // level/xp bar
  const barW = Math.min(300, W - 64), barH = 10;
  const need = xpToNext(save.level);
  const frac = clamp(save.xp / need, 0, 1);
  g.save();
  g.beginPath(); g.roundRect(CX - barW / 2, L.levelBarY, barW, barH, 5);
  g.fillStyle = 'rgba(245,247,250,0.12)'; g.fill();
  if (frac > 0) {
    g.beginPath(); g.roundRect(CX - barW / 2, L.levelBarY, barW * frac, barH, 5);
    g.fillStyle = PAL.perfect; g.fill();
  }
  g.restore();
  g.fillStyle = COL.gray; g.font = '600 13px ' + FONT;
  g.fillText(S.lvLabel(save.level) + '  ·  ' + save.xp + '/' + need + ' XP', CX, L.levelBarY - 14);

  g.fillStyle = PAL.perfect; g.font = '700 15px ' + FONT;
  g.fillText(S.coinsLabel(save.coins), CX, L.coinsY);

  const unlockedCount = ACH_ORDER.filter(id => save.achievements[id]).length;
  g.fillStyle = COL.gray; g.font = '600 13px ' + FONT;
  g.fillText(S.achLabel(unlockedCount, ACH_ORDER.length), CX, L.achLabelY);
  for (const d of L.achDots) {
    const on = !!save.achievements[d.id];
    g.beginPath(); g.arc(d.x, d.y, d.r, 0, TAU);
    g.fillStyle = on ? PAL.perfect : 'rgba(245,247,250,0.15)';
    g.fill();
    if (on) { g.shadowBlur = 8; g.shadowColor = PAL.perfect; g.fill(); g.shadowBlur = 0; }
  }

  g.fillStyle = COL.gray; g.font = '600 13px ' + FONT;
  g.fillText(S.themesLabel, CX, L.themesLabelY);
  for (const t of L.themes) {
    const meta = THEMES[t.id];
    const unlocked = isThemeUnlocked(t.id);
    const active = save.activeTheme === t.id;
    g.beginPath(); g.arc(t.x + t.w / 2, t.y + t.h / 2, t.w / 2, 0, TAU);
    g.fillStyle = meta.bg; g.fill();
    g.lineWidth = active ? 3 : 1.5;
    g.strokeStyle = active ? PAL.perfect : (unlocked ? 'rgba(245,247,250,0.4)' : 'rgba(245,247,250,0.15)');
    g.stroke();
    g.beginPath(); g.arc(t.x + t.w / 2, t.y + t.h / 2, 6, 0, TAU); g.fillStyle = meta.perfect; g.fill();
    g.fillStyle = unlocked ? COL.gray : 'rgba(138,147,166,0.6)';
    g.font = '500 10px ' + FONT;
    g.fillText(unlocked ? meta.name : S.priceLabel(meta.price), t.x + t.w / 2, t.y + t.h + 12);
  }

  g.fillStyle = COL.gray; g.font = '600 13px ' + FONT;
  g.fillText(S.trailsLabel, CX, L.trailsLabelY);
  for (const t of L.trails) {
    const meta = TRAILS[t.id];
    const unlocked = isTrailUnlocked(t.id);
    const active = save.activeTrail === t.id;
    g.beginPath(); g.arc(t.x + t.w / 2, t.y + t.h / 2, t.w / 2, 0, TAU);
    g.fillStyle = 'rgba(245,247,250,0.08)'; g.fill();
    g.lineWidth = active ? 3 : 1.5;
    g.strokeStyle = active ? meta.color : (unlocked ? 'rgba(245,247,250,0.4)' : 'rgba(245,247,250,0.15)');
    g.stroke();
    g.beginPath(); g.arc(t.x + t.w / 2, t.y + t.h / 2, 6, 0, TAU); g.fillStyle = meta.color; g.fill();
    g.fillStyle = unlocked ? COL.gray : 'rgba(138,147,166,0.6)';
    g.font = '500 10px ' + FONT;
    g.fillText(unlocked ? meta.name : S.priceLabel(meta.price), t.x + t.w / 2, t.y + t.h + 12);
  }

  for (const s2 of L.settings) {
    g.save();
    g.beginPath(); g.roundRect(s2.x, s2.y, s2.w, s2.h, 10);
    g.fillStyle = 'rgba(245,247,250,0.06)'; g.fill();
    g.textAlign = 'left';
    g.fillStyle = PAL.needle; g.font = '600 14px ' + FONT;
    g.fillText(s2.label, s2.x + 14, s2.y + s2.h / 2);
    const on = !!save.settings[s2.id];
    g.textAlign = 'right';
    g.fillStyle = on ? PAL.perfect : COL.gray;
    g.font = '700 13px ' + FONT;
    g.fillText(on ? S.onLabel : S.offLabel, s2.x + s2.w - 14, s2.y + s2.h / 2);
    g.restore();
  }
  g.textAlign = 'center';
}

function renderMute() {
  const r = muteRect();
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  g.save();
  g.globalAlpha = 0.75;
  g.strokeStyle = PAL.needle; g.fillStyle = PAL.needle; g.lineWidth = 2;
  g.beginPath();
  g.moveTo(cx - 9, cy - 4); g.lineTo(cx - 4, cy - 4); g.lineTo(cx + 2, cy - 9);
  g.lineTo(cx + 2, cy + 9); g.lineTo(cx - 4, cy + 4); g.lineTo(cx - 9, cy + 4);
  g.closePath(); g.fill();
  if (muted) {
    g.strokeStyle = COL.miss;
    g.beginPath(); g.moveTo(cx + 5, cy - 6); g.lineTo(cx + 13, cy + 6); g.stroke();
    g.beginPath(); g.moveTo(cx + 13, cy - 6); g.lineTo(cx + 5, cy + 6); g.stroke();
  } else {
    g.beginPath(); g.arc(cx + 4, cy, 5, -0.9, 0.9); g.stroke();
    g.beginPath(); g.arc(cx + 4, cy, 9, -0.9, 0.9); g.stroke();
  }
  g.restore();
}

function renderBackBtn() {
  const r = backBtnRect();
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  g.save();
  g.globalAlpha = 0.75;
  g.strokeStyle = PAL.needle; g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(cx + 8, cy - 9); g.lineTo(cx - 4, cy); g.lineTo(cx + 8, cy + 9);
  g.stroke();
  g.restore();
}

/* ---------------- main loop ---------------- */
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - lastNow) / 1000, 0, 0.05);
  lastNow = now;
  if (paused) return;
  update(dt);
  render(now);
}
requestAnimationFrame(frame);
</script>
</body>
